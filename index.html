<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoBoard | GoUni Student Showcase</title>
    <meta name="description" content="Discover, showcase, and celebrate student engineering projects, literature, and tech innovations at Godfrey Okoye University." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Machine-Readable Documentation for LLMs, AI Agents & Crawlers -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="GoBoard LLM Documentation Index" />
    <link rel="alternate" type="text/markdown" href="/llms-full.txt" title="Full GoBoard Knowledge Base (Markdown)" />
    <link rel="alternate" type="application/json" href="/api/docs" title="GoBoard Machine-Readable API" />

    <!-- Structured JSON-LD Metadata for AI Agents & Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GoBoard",
        "url": "https://goboard-psi.vercel.app",
        "description": "Verified student software showcase, learning curriculum, and developer network for Godfrey Okoye University.",
        "applicationCategory": "DeveloperApplication, EducationalApplication",
        "operatingSystem": "All",
        "creator": {
          "@type": "EducationalOrganization",
          "name": "Godfrey Okoye University - Faculty of Computing",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Enugu",
            "addressCountry": "Nigeria"
          }
        },
        "documentation": "https://goboard-psi.vercel.app/docs",
        "potentialAction": {
          "@type": "ReadAction",
          "target": [
            "https://goboard-psi.vercel.app/llms.txt",
            "https://goboard-psi.vercel.app/llms-full.txt",
            "https://goboard-psi.vercel.app/api/docs"
          ]
        }
      }
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('goboard_theme');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Custom Pre-React Loading Screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      html.dark #loading-screen {
        background: #09090b;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .logo-container {
        position: relative;
        width: 400px;
        height: 400px;
        overflow: hidden;
      }

      .logo-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .logo-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        position: absolute;
        top: 0;
        left: 0;
      }

      .logo-masked {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        clip-path: circle(0% at 50% 50%);
        animation: maskReveal 4s ease-in-out infinite;
      }

      @keyframes maskReveal {
        0% {
          clip-path: circle(0% at 50% 50%);
        }
        40% {
          clip-path: circle(70% at 50% 50%);
        }
        85% {
          clip-path: circle(70% at 50% 50%);
        }
        100% {
          clip-path: circle(0% at 50% 50%);
        }
      }

      .title {
        position: absolute;
        top: -50px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 2px;
        z-index: 10;
      }

      html.dark .title {
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="logo-container">
        <div class="title">GoBoard</div>
        <div class="logo-wrapper">
          <img class="logo-image logo-masked" src="./customloading/logo-white-black.png" alt="GoBoard Logo" width="400" height="400" decoding="async" fetchpriority="high">
        </div>
      </div>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
