<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoBoard | GoUni Student Showcase</title>
    <meta name="description" content="Discover, showcase, and celebrate student engineering projects, literature, and tech innovations at Godfrey Okoye University." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('goboard_theme');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Custom Pre-React Loading Screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      html.dark #loading-screen {
        background: #09090b;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .logo-container {
        position: relative;
        width: 400px;
        height: 400px;
        overflow: hidden;
      }

      .logo-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .logo-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        position: absolute;
        top: 0;
        left: 0;
      }

      .logo-masked {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        clip-path: circle(0% at 50% 50%);
        animation: maskReveal 4s ease-in-out infinite;
      }

      @keyframes maskReveal {
        0% {
          clip-path: circle(0% at 50% 50%);
        }
        40% {
          clip-path: circle(70% at 50% 50%);
        }
        85% {
          clip-path: circle(70% at 50% 50%);
        }
        100% {
          clip-path: circle(0% at 50% 50%);
        }
      }

      .title {
        position: absolute;
        top: -50px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 2px;
        z-index: 10;
      }

      html.dark .title {
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="logo-container">
        <div class="title">GoBoard</div>
        <div class="logo-wrapper">
          <img class="logo-image logo-masked" src="./customloading/logo-white-black.png" alt="GoBoard Logo">
        </div>
      </div>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
